const SC = 100;

function el(name, attrs, parent) {
  const n = document.createElementNS(NS, name);
  for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);

  return n;

function drawHexes(root) {

  for (let h = 0; h < 19; h++) {

function drawGlyphs(root) {
  const layer = g(root, { opacity:.85 });
  for (let h = 0; h < 19; h++) {
    const r = BOARD.res[h], hasToken = BOARD.num[h] !== 0;
    // Desert carries no number, so its mark takes the centre instead.

function drawTokens(root) {
  const layer = g(root);
  for (let h = 0; h < 19; h++) {
    const n = BOARD.num[h];
    if (!n) continue;
    const cx = HX(h), cy = HY(h), hot = n === 6 || n === 8;
    el("circle", { cx, cy, r:33, fill:"#FFFFFF", filter:"url(#sh)" }, layer);
    txt(layer, cx, cy - 4, String(n), {
      class:"tok", "font-size":34, fill:hot ? "#C4402C" : "#161616",
    });
    const k = pips(n);
    for (let i = 0; i < k; i++) {
      el("circle", { class:"pip", cx:cx + (i - (k - 1) / 2) * 7, cy:cy + 18, r:2.2,
        fill:hot ? "#C4402C" : "#A6A6A6" }, layer);
    }
  }

    for (const v of [a, b]) {
      el("circle", { class:"anchor", cx:VX(v), cy:VY(v), r:6,
        fill:"#FFFFFF", stroke:"#C9C9C9", "stroke-width":2.5 }, node);
    }
    el("circle", { class:"badge", cx:px, cy:py, r:31,
      fill:"#FFFFFF", stroke:"#E0E0E0", "stroke-width":2.5, filter:"url(#sh)" }, node);

    if (type === 5) {
      // Generic: three marks, one rate. No single resource to show.
      for (let k = 0; k < 3; k++) {
        const ang = (-90 + k * 120) * Math.PI / 180;
        el("circle", { cx:px + Math.cos(ang) * 13, cy:py + Math.sin(ang) * 13 - 4,
          r:4.4, fill:"#B4B4B4" }, node);
      }
      txt(node, px, py + 19, "3:1", { class:"portlbl", "font-size":11.5, fill:"#6E6E6E" });
    } else {
      const G2 = g(node, { transform:`translate(${px},${py - 6}) scale(0.9)` });
      GLYPHS[type](G2, GLYPH[type]);
      txt(node, px, py + 20, "2:1", { class:"portlbl", "font-size":11.5, fill:"#6E6E6E" });
    }

    const name = type === 5
      ? "3:1 port - trade any 3 alike for 1"
      : `2:1 ${RES[type]} port - trade 2 ${RES[type]} for 1 of anything`;
    node.addEventListener("mousemove", (ev) => showTip(name, ev));
    node.addEventListener("mouseleave", hideTip);
  }
}

const ROBBER_DY = -56; // above the number token; the terrain glyph is below it

/** The robbed hex is washed out, because it produces nothing. */
function drawRobber(root) {
  const cx = HX(S.robber), cy = HY(S.robber) + ROBBER_DY;
  const G = g(root);
  el("polygon", { points:hexPoly(S.robber), fill:"#161616", opacity:.14 }, G);
  el("circle", { cx, cy, r:15, fill:"#2B2B2B", filter:"url(#sh)" }, G);
  el("circle", { cx, cy:cy - 3.5, r:5.5, fill:"#FFFFFF", opacity:.92 }, G);
}

/* The piece placed most recently, so `drawPieces` can animate exactly one
   thing. Cleared by age rather than by event: `render` runs on every sync and
   re-adding the class would restart the animation on an unrelated redraw. */
let justBuilt = null;
function markBuilt(kind, id) { justBuilt = { kind, id, used:false }; }
/* True exactly once, for the first render after the piece is placed. `render`
   runs on every sync - and a placement is usually followed by more of them as
   chance nodes resolve - so without consuming the flag the animation restarts
   repeatedly and the piece never settles. */
function isFresh(kind, id) {
  if (!justBuilt || justBuilt.used) return false;
  if (justBuilt.kind !== kind || justBuilt.id !== id) return false;
  justBuilt.used = true;
  return true;
}

function drawPieces(root) {
  const layer = g(root);

  // Roads: a plank with a lighter centre stripe, so direction and owner read
  // at a glance instead of a flat bar.
  for (let e = 0; e < 72; e++) {
    if (!S.path[e]) continue;
    const p = S.path[e] - 1, [a, b] = GEO.path_vertices[e];
    const x1 = VX(a), y1 = VY(a), x2 = VX(b), y2 = VY(b);
    const ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
    const L = Math.hypot(x2 - x1, y2 - y1) * 0.72;
    const anchor = g(layer, {
      transform:`translate(${(x1 + x2) / 2},${(y1 + y2) / 2}) rotate(${ang})`,
    });
    const road = g(anchor);
    if (isFresh("road", e)) road.setAttribute("class", "built");
    el("rect", { x:-L / 2, y:-7, width:L, height:14, rx:7, fill:PLAYER[p],
      stroke:"#FFFFFF", "stroke-width":2.5, filter:"url(#sh)" }, road);
    el("rect", { x:-L / 2 + 5, y:-2.2, width:Math.max(L - 10, 2), height:4.4, rx:2.2,
      fill:"#FFFFFF", opacity:.30 }, road);
  }

  for (let v = 0; v < 54; v++) {
    const o = S.vertex[v];
    if (!o) continue;
    const p = o <= 2 ? 0 : 1, city = o === 2 || o === 4;
    const anchor = g(layer, { transform:`translate(${VX(v)},${VY(v)})` });
    const seat = g(anchor);
    if (isFresh(city ? "city" : "settle", v)) seat.setAttribute("class", "built");

    if (city) {
      // A keep: wide base with a tower, so a city is unmistakably not a
      // settlement even at a glance across the board.
      el("rect", { x:-15, y:-3, width:30, height:17, rx:3.5, fill:PLAYER[p],
        stroke:"#FFFFFF", "stroke-width":3, filter:"url(#sh)" }, seat);
      el("rect", { x:-13, y:-16, width:13, height:14, rx:2.5, fill:PLAYER[p],
        stroke:"#FFFFFF", "stroke-width":3 }, seat);
      el("rect", { x:2, y:2, width:11, height:8, rx:1.5, fill:"#FFFFFF", opacity:.34 }, seat);
    } else {
      // A house, not a dot.
      el("polygon", {
        points:"0,-15 13,-3 9.5,-3 9.5,11 -9.5,11 -9.5,-3 -13,-3",
        fill:PLAYER[p], stroke:"#FFFFFF", "stroke-width":3,
        "stroke-linejoin":"round", filter:"url(#sh)",
      }, seat);
      el("rect", { x:-3.5, y:1, width:7, height:10, rx:1.4, fill:"#FFFFFF", opacity:.36 }, seat);
    }
  }
}


CENTER=[HX(9),HY(9)];

const COLORS=["#3e6fa8","#bc503b"];
function ownership(picks){const state={vertex:Array(54).fill(0),path:Array(72).fill(0)};for(const p of picks){state.vertex[p.chosen]=p.seat===0?3:1;if(p.road!=null)state.path[p.road]=p.seat===0?2:1}return state}
function baseBoard(root,board,picks){BOARD={res:board[0],num:board[1],port:board[2]};S={...ownership(picks),robber:board[0].indexOf(5)};justBuilt=null;root.replaceChildren();root.setAttribute('viewBox','-470 -185 1040 970');const id=root.id+'-shadow',defs=el('defs',{},root),sh=el('filter',{id,x:'-40%',y:'-40%',width:'180%',height:'180%'},defs);el('feDropShadow',{dx:0,dy:1.5,stdDeviation:2.2,'flood-color':'#000','flood-opacity':.16},sh);drawPorts(root);drawHexes(root);drawGlyphs(root);drawTokens(root);drawRobber(root);drawPieces(root);root.querySelectorAll('[filter]').forEach(n=>n.setAttribute('filter',`url(#${id})`))}
function label(root,p,active=false){const x=VX(p.chosen),y=VY(p.chosen),color=COLORS[p.seat],group=g(root,{});if(active)el('circle',{cx:x,cy:y,r:27,fill:'none',stroke:color,'stroke-width':4},group);el('line',{x1:x+8,y1:y-9,x2:x+23,y2:y-23,stroke:'white','stroke-width':5},group);el('rect',{x:x+12,y:y-51,width:66,height:34,rx:7,fill:'white',stroke:color,'stroke-width':2.5},group);txt(group,x+45,y-33,p.label,{'font-size':27,'font-weight':700,fill:color})}
function profile(board,v){const values=[0,0,0,0,0];for(const h of GEO.vertex_hexes[v])if(h!=null&&h>=0&&board[0][h]<5)values[board[0][h]]+=pips(board[1][h]);return values}
const $=id=>document.getElementById(id);
const pct=n=>n<0.0005?'<0.1%':(n*100).toFixed(1)+'%';
function render(index){const c=EXAMPLES[index],p=c.picks[c.step];
 document.querySelectorAll('#tabs button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));
 const visible=c.picks.slice(0,c.step+1).map((x,i)=>i===c.step?{...x,road:null}:x);
 baseBoard($('board'),c.board,visible);visible.forEach(x=>label($('board'),x,x.label===p.label));
 el('circle',{cx:VX(c.alt),cy:VY(c.alt),r:29,fill:'none',stroke:'#826b43','stroke-width':5,'stroke-dasharray':'8 5'},$('board'));
 el('rect',{x:VX(c.alt)-31,y:VY(c.alt)+25,width:62,height:36,rx:6,fill:'#fff',stroke:'#826b43','stroke-width':2},$('board'));
 txt($('board'),VX(c.alt),VY(c.alt)+44,'Alt',{'font-size':25,'text-anchor':'middle','dominant-baseline':'middle',fill:'#6b532e','font-weight':600});
 $('board').setAttribute('aria-label',`Board ${c.seed}: ${p.label} at corner ${p.chosen}; maximum-pip alternative at corner ${c.alt}`);
 $('meta').textContent=`Board ${c.seed.toLocaleString()} (${p.label}, player ${p.seat?'B':'A'})`;
 $('note').textContent=c.note;
 const a=profile(c.board,p.chosen),b=profile(c.board,c.alt),prior=[0,0,0,0,0];
 c.picks.slice(0,c.step).filter(x=>x.seat===p.seat).forEach(x=>profile(c.board,x.chosen).forEach((n,i)=>prior[i]+=n));
 const coverage=x=>x.filter((n,i)=>n+prior[i]>0).length;
 $('stats').innerHTML=`<thead><tr><th></th><th>Chosen<br>${p.chosen}</th><th>Max pips<br>${c.alt}</th></tr></thead><tbody>`+
 RES.map((r,i)=>`<tr><td>${r[0].toUpperCase()+r.slice(1)} pips</td><td>${a[i]}</td><td>${b[i]}</td></tr>`).join('')+
 `<tr class="total"><td>Total pips</td><td>${a.reduce((a,b)=>a+b,0)}</td><td>${b.reduce((a,b)=>a+b,0)}</td></tr><tr><td>Resources covered</td><td>${coverage(a)} / 5</td><td>${coverage(b)} / 5</td></tr><tr class="total"><td>Network policy</td><td>${pct(c.chosen_stats.preference)}</td><td>${pct(c.alt_stats.preference)}</td></tr></tbody>`;
 measure();
}
EXAMPLES.forEach((c,i)=>{const b=document.createElement('button');b.textContent=c.title;b.type='button';b.onclick=()=>render(i);$('tabs').append(b)});
let last=0;function measure(){const h=Math.ceil($('figure').getBoundingClientRect().height+12);if(last!==h){last=h;parent.postMessage({type:'catan-figure-resize',height:h},'*')}}
new ResizeObserver(measure).observe($('figure'));addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='catan-figure-measure'){last=0;measure()}});render(0);
