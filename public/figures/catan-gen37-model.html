<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generation 37 network architecture</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:#1a1a1a;color-scheme:light}
body{font:16px/1.55 "Palatino Linotype","Book Antiqua",Palatino,Georgia,serif}
h3{font-size:1.2rem;line-height:1.3;margin:0}.figure-heading{display:flex;justify-content:space-between;align-items:baseline;gap:.4rem 1rem;flex-wrap:wrap;margin:0 0 1rem}.figure-heading p{margin:0;font-size:.9rem;color:#6f6d68}
.diagram{overflow-x:auto;overscroll-behavior-x:contain}
svg{display:block;width:100%;height:auto;min-width:680px}
svg text{font-family:inherit;fill:#242424;text-anchor:middle}
.box{stroke:#deded7;stroke-width:1}
.tile{fill:#fbf7ed}.vertex{fill:#f1f5f9}.road{fill:#f2f6f1}.global{fill:#f6f2f8}
.arrow{fill:none;stroke:#8b9188;stroke-width:1.4;marker-end:url(#arrow)}
.line{fill:none;stroke:#8b9188;stroke-width:1.4}
.heading{font-size:18px;font-weight:600}.shape{font-size:18px}.label{font-size:16px}.small{font-size:14px;fill:#626262}
.caption{font-size:.86rem;color:#626262;margin:.55rem 0 0}
.hint{display:none}
@media(max-width:600px){.hint{display:block;font-size:.85rem;color:#626262;margin:.25rem 0 .6rem}}
</style>
<link rel="stylesheet" href="article-figure-typography.css"></head>
<body>
<div id="figure">
<div class="figure-heading"><h3>Generation 37</h3><p>1,320,375 parameters</p></div>
<p class="hint">Scroll sideways to see the full diagram.</p>
<div class="diagram" tabindex="0" aria-label="Generation 37 architecture overview; horizontally scrollable on narrow screens">
<svg viewBox="0 0 880 450" role="img" aria-labelledby="architecture-title architecture-description" xmlns="http://www.w3.org/2000/svg">
<title id="architecture-title">Generation 37: inputs, embeddings, four graph blocks, and output heads</title>
<desc id="architecture-description">Four input tensors enter separate linear and ReLU embeddings: 19 tiles with 32 features become 19 by 128; 54 intersections with 48 features become 54 by 128; 72 road locations with 16 features become 72 by 128; and 400 global features become 128. Four message-passing blocks use fixed board connections and preserve these four tensor shapes. Policy heads read all four groups, producing 241 action logits followed by a legal-action mask and softmax. The value head reads only the global vector, producing one value through a linear layer and tanh. Training-only ownership heads read intersections and roads.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#8b9188"/></marker></defs>

<!-- The four tensor groups retain separate rows throughout the network. -->
<rect class="box tile" x="12" y="4" width="190" height="56" rx="5"/>
<text class="heading" x="107" y="27">Tiles</text><text class="shape" x="107" y="49">19 × 32</text>
<rect class="box vertex" x="234" y="4" width="190" height="56" rx="5"/>
<text class="heading" x="329" y="27">Intersections</text><text class="shape" x="329" y="49">54 × 48</text>
<rect class="box road" x="456" y="4" width="190" height="56" rx="5"/>
<text class="heading" x="551" y="27">Road locations</text><text class="shape" x="551" y="49">72 × 16</text>
<rect class="box global" x="678" y="4" width="190" height="56" rx="5"/>
<text class="heading" x="773" y="27">Global state</text><text class="shape" x="773" y="49">400</text>

<path class="arrow" d="M107 60 V88"/><path class="arrow" d="M329 60 V88"/>
<path class="arrow" d="M551 60 V88"/><path class="arrow" d="M773 60 V88"/>
<rect class="box tile" x="12" y="89" width="190" height="61" rx="5"/>
<text class="label" x="107" y="113">Linear → ReLU</text><text class="shape" x="107" y="137">19 × 128</text>
<rect class="box vertex" x="234" y="89" width="190" height="61" rx="5"/>
<text class="label" x="329" y="113">Linear → ReLU</text><text class="shape" x="329" y="137">54 × 128</text>
<rect class="box road" x="456" y="89" width="190" height="61" rx="5"/>
<text class="label" x="551" y="113">Linear → ReLU</text><text class="shape" x="551" y="137">72 × 128</text>
<rect class="box global" x="678" y="89" width="190" height="61" rx="5"/>
<text class="label" x="773" y="113">Linear → ReLU</text><text class="shape" x="773" y="137">128</text>

<path class="arrow" d="M107 150 V180"/><path class="arrow" d="M329 150 V180"/>
<path class="arrow" d="M551 150 V180"/><path class="arrow" d="M773 150 V180"/>
<rect class="box" x="12" y="181" width="856" height="109" rx="5" fill="#fafbf9"/>
<text class="heading" x="440" y="204">Residual message passing</text>
<rect class="box" x="136" y="217" width="124" height="30" rx="4" fill="#fff"/>
<rect class="box" x="297" y="217" width="124" height="30" rx="4" fill="#fff"/>
<rect class="box" x="458" y="217" width="124" height="30" rx="4" fill="#fff"/>
<rect class="box" x="619" y="217" width="124" height="30" rx="4" fill="#fff"/>
<text class="label" x="198" y="237">Block 1</text><text class="label" x="359" y="237">Block 2</text>
<text class="label" x="520" y="237">Block 3</text><text class="label" x="681" y="237">Block 4</text>
<path class="arrow" d="M260 232 H296"/><path class="arrow" d="M421 232 H457"/><path class="arrow" d="M582 232 H618"/>
<text class="shape" x="107" y="277">19 × 128</text><text class="shape" x="329" y="277">54 × 128</text>
<text class="shape" x="551" y="277">72 × 128</text><text class="shape" x="773" y="277">128</text>

<!-- Source labels distinguish the readouts; the value head sees only global features. -->
<path class="line" d="M440 290 V309"/>
<path class="arrow" d="M440 309 H218 V334"/>
<path class="arrow" d="M440 309 H550 V334"/>
<path class="arrow" d="M440 309 H772 V334" stroke-dasharray="4 4"/>
<rect class="box" x="12" y="335" width="412" height="108" rx="5" fill="#f2f6f1"/>
<text class="heading" x="218" y="359">Policy heads</text>
<text class="label" x="218" y="383">All four groups → 241 logits</text>
<text class="label" x="218" y="407">Legal mask → softmax</text>
<text class="small" x="218" y="430">Action probabilities</text>
<rect class="box global" x="456" y="335" width="190" height="108" rx="5"/>
<text class="heading" x="551" y="359">Value head</text>
<text class="label" x="551" y="383">Global → linear → tanh</text>
<text class="shape" x="551" y="408">1 value in [−1, 1]</text>
<rect class="box" x="678" y="335" width="190" height="108" rx="5" fill="#fafafa" stroke-dasharray="4 4"/>
<text class="heading" x="773" y="359">Ownership heads</text>
<text class="small" x="773" y="383">Intersections + roads</text>
<text class="shape" x="773" y="407">54 × 5, 72 × 3</text>
<text class="small" x="773" y="430">Training only</text>
</svg>
</div>
<p class="caption">Mean aggregation with separate weights in each graph block.</p>
</div>
<script>
const root=document.getElementById('figure');let last=0;
function measure(){const height=Math.ceil(root.getBoundingClientRect().height+12);if(height!==last){last=height;parent.postMessage({type:'catan-figure-resize',height},'*');}}
new ResizeObserver(measure).observe(root);addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='catan-figure-measure'){last=0;measure();}});measure();
</script>
</body>
</html>
