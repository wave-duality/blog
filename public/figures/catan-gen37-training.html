<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generation 36 to Generation 37: self-play and training</title>
<link rel="stylesheet" href="article-figure-typography.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:#1a1a1a;color-scheme:light}
body{font:16px/1.55 "Palatino Linotype","Book Antiqua",Palatino,Georgia,serif}
h3{font-size:1.2rem;line-height:1.3;margin:0}
.figure-heading{display:flex;justify-content:space-between;align-items:baseline;gap:.4rem 1rem;flex-wrap:wrap;margin:0 0 1rem}
.figure-heading p{margin:0;font-size:.9rem;color:#6f6d68}
.diagram{overflow-x:auto;overscroll-behavior-x:contain}
svg{display:block;width:100%;height:auto;min-width:680px}
svg text{font-family:inherit;fill:#242424;text-anchor:middle}
.box{stroke:#deded7;stroke-width:1}
.arrow{fill:none;stroke:#8b9188;stroke-width:1.4;marker-end:url(#arrow)}
.heading{font-size:19px;font-weight:600}.label{font-size:17px}.small{font-size:15px;fill:#626262}
.caption{font-size:.86rem;color:#626262;margin:.55rem 0 0}
.hint{display:none}
@media(max-width:600px){.hint{display:block;font-size:.85rem;color:#626262;margin:.25rem 0 .6rem}}
</style>
</head>
<body>
<div id="figure">
<div class="figure-heading"><h3>One training generation</h3><p>Generation 36 → Generation 37</p></div>
<p class="hint">Scroll sideways to see the full diagram.</p>
<div class="diagram" tabindex="0" aria-label="Self-play and training flow; horizontally scrollable on narrow screens">
<svg viewBox="0 0 880 300" role="img" aria-labelledby="training-title training-description" xmlns="http://www.w3.org/2000/svg">
<title id="training-title">How Generation 36 produced Generation 37</title>
<desc id="training-description">Frozen Generation 36 supplies policy and value evaluations during search. Self-play repeatedly searches and plays actions until games finish. The recorded 1,940 games yield 289,034 learner positions. AdamW trains a copy of Generation 36 on these examples for one epoch, producing Generation 37.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#8b9188"/></marker></defs>

<rect class="box" x="12" y="4" width="232" height="95" rx="5" fill="#f2f6f1"/>
<text class="heading" x="128" y="32">Generation 36</text>
<text class="label" x="128" y="59">Policy + value</text>
<text class="small" x="128" y="83">Frozen during self-play</text>

<path class="arrow" d="M244 52 H324"/>
<rect class="box" x="325" y="4" width="230" height="95" rx="5" fill="#fafaf8"/>
<text class="heading" x="440" y="32">Search</text>
<text class="label" x="440" y="59">Gumbel root + PUCT</text>
<text class="small" x="440" y="83">1,024 simulations per decision</text>

<path class="arrow" d="M555 52 H635"/>
<rect class="box" x="636" y="4" width="232" height="95" rx="5" fill="#f1f5f9"/>
<text class="heading" x="752" y="32">Play an action</text>
<text class="label" x="752" y="59">Rules engine</text>
<text class="small" x="752" y="83">Advance the game</text>

<path class="arrow" d="M700 99 V132 H440 V100" stroke-dasharray="4 4"/>
<text class="small" x="570" y="153">Next decision</text>
<path class="arrow" d="M804 99 V181"/>
<text class="small" x="794" y="153" style="text-anchor:end">Game ends</text>

<rect class="box" x="636" y="182" width="232" height="111" rx="5" fill="#f1f5f9"/>
<text class="heading" x="752" y="212">1,940 games</text>
<text class="label" x="752" y="240">289,034 learner positions</text>
<text class="small" x="752" y="268">Search targets + final outcomes</text>

<path class="arrow" d="M636 238 H556"/>
<rect class="box" x="325" y="182" width="230" height="111" rx="5" fill="#f6f2f8"/>
<text class="heading" x="440" y="212">Train Generation 36</text>
<text class="label" x="440" y="240">AdamW (one epoch)</text>
<text class="small" x="440" y="268">Batches of 512</text>

<path class="arrow" d="M325 238 H245"/>
<rect class="box" x="12" y="182" width="232" height="111" rx="5" fill="#f2f6f1"/>
<text class="heading" x="128" y="212">Generation 37</text>
<text class="label" x="128" y="240">Updated policy + value</text>
<text class="small" x="128" y="268">Saved checkpoint</text>
</svg>
</div>
<p class="caption">Opponent sampling: 75% mirror play, 25% frozen exploiter33.</p>
</div>
<script>
const root=document.getElementById('figure');let last=0;
function measure(){const height=Math.ceil(root.getBoundingClientRect().height+12);if(height!==last){last=height;parent.postMessage({type:'catan-figure-resize',height},'*');}}
new ResizeObserver(measure).observe(root);addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='catan-figure-measure'){last=0;measure();}});measure();
</script>
</body>
</html>
